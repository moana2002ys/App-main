kind = "web"
previewPath = "/deco-lab/"
title = "조각조각 꾸미기 프로토타입"
version = "1.0.0"
id = "artifacts/deco-lab"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/deco-lab/" ]
localPort = 20047

[services.development]
run = "pnpm --filter @workspace/deco-lab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/deco-lab", "run", "build" ]
publicDir = "artifacts/deco-lab/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20047"
BASE_PATH = "/deco-lab/"
